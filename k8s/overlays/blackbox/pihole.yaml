apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-data
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: blackbox
      automountServiceAccountToken: false
      containers:
        - name: pihole
          image: pihole/pihole:2026.11.0
          env:
            - name: TZ
              value: America/Guadeloupe
            - name: FTLCONF_dns_listeningMode
              value: NONE
            - name: FTLCONF_misc_dnsmasq_lines
              value: |-
                listen-address=192.168.1.200
                bind-interfaces
            - name: FTLCONF_dns_upstreams
              value: "1.1.1.1;9.9.9.9"
            - name: FTLCONF_webserver_port
              value: "192.168.1.200:8088"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole
                  key: web-password
          ports:
            - name: dns-tcp
              containerPort: 53
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 8088
          readinessProbe:
            tcpSocket:
              port: dns-tcp
          volumeMounts:
            - name: data
              mountPath: /etc/pihole
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pihole-data
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
spec:
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: pihole.home.stephenbolivar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole-web
                port:
                  name: http
