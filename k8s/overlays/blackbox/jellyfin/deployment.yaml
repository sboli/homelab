apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: blackbox
      securityContext:
        runAsNonRoot: true
        runAsUser: 1024
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-config
          image: jellyfin/jellyfin:12.4
          command:
            - /bin/sh
            - -ec
            - |
              umask 027
              mkdir -p /state/config/config /state/cache
              for file in database.xml network.xml; do
                cp "/desired/$file" "/state/config/config/$file.new"
                mv -f "/state/config/config/$file.new" "/state/config/config/$file"
              done
          volumeMounts:
            - name: state
              mountPath: /state
            - name: desired-config
              mountPath: /desired
              readOnly: true
        - name: configure
          image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          restartPolicy: Always
          command: ["python", "-u", "/desired/configure.py"]
          env:
            - name: JELLYFIN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-admin
                  key: password
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/jellyfin-configured"]
          volumeMounts:
            - name: desired-config
              mountPath: /desired
              readOnly: true
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4
          env:
            - name: TZ
              value: America/Guadeloupe
          ports:
            - name: http
              containerPort: 8096
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: state
              mountPath: /config
              subPath: config
            - name: state
              mountPath: /cache
              subPath: cache
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: jellyfin-data-nfs
        - name: media
          nfs:
            server: 192.168.1.201
            path: /volume1/media/media
            readOnly: true
        - name: desired-config
          configMap:
            name: jellyfin-config
