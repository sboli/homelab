apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: blackbox
      initContainers:
        - name: install-config
          image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          command: ["python", "/desired/configure-arr.py"]
          env:
            - name: ARR_APP
              value: prowlarr
          securityContext:
            runAsNonRoot: true
            runAsUser: 1024
            runAsGroup: 100
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: prowlarr
            - name: desired-config
              mountPath: /desired
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:3.1.0.5799-ls170
          env:
            - name: PUID
              value: "1024"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/Guadeloupe
          ports:
            - name: http
              containerPort: 9696
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: prowlarr
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: media-stack-nfs
        - name: desired-config
          configMap:
            name: media-arr-config
        - name: credentials
          secret:
            secretName: media-stack
            items:
              - key: prowlarr-api-key
                path: api-key
              - key: prowlarr-db
                path: db-password
