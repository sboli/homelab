apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-bootstrap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-bootstrap
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1024
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          command: ["python", "-u", "/desired/configure-stack.py"]
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/media-configured"]
          volumeMounts:
            - name: desired-config
              mountPath: /desired
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
      volumes:
        - name: desired-config
          configMap:
            name: media-bootstrap-config
        - name: credentials
          projected:
            sources:
              - secret:
                  name: media-stack
                  items:
                    - key: arr-admin-password
                      path: arr-admin-password
                    - key: prowlarr-api-key
                      path: prowlarr-api-key
                    - key: radarr-api-key
                      path: radarr-api-key
                    - key: sonarr-api-key
                      path: sonarr-api-key
              - secret:
                  name: jellyfin-admin
                  items:
                    - key: password
                      path: jellyfin-password
              - secret:
                  name: media-qbittorrent
                  items:
                    - key: api-key
                      path: qbittorrent-api-key
