apiVersion: v1
kind: Service
metadata:
  name: unmanic
spec:
  selector:
    app.kubernetes.io/name: unmanic
  ports:
    - name: http
      port: 8888
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unmanic
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: unmanic.home.stephenbolivar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unmanic
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unmanic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unmanic
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
      ports:
        - protocol: TCP
          port: 8888
