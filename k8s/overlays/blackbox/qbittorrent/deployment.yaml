apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: blackbox
      initContainers:
        - name: install-config
          image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          command: ["python", "/desired/configure.py"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1024
            runAsGroup: 100
          volumeMounts:
            - name: config
              mountPath: /config
            - name: desired-config
              mountPath: /desired
              readOnly: true
            - name: webui-credentials
              mountPath: /credentials
              readOnly: true
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.3.1_v2.1.3-ls490
          env:
            - name: TZ
              value: America/Guadeloupe
            - name: PUID
              value: "1024"
            - name: PGID
              value: "100"
            - name: WEBUI_PORT
              value: "8089"
            - name: TORRENTING_PORT
              value: "51413"
          ports:
            - name: http
              containerPort: 8089
            - name: peer-tcp
              containerPort: 51413
            - name: peer-udp
              containerPort: 51413
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: qbittorrent.home.stephenbolivar.com
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /mnt/downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-nfs
        - name: downloads
          hostPath:
            path: /mnt/downloads
            type: Directory
        - name: desired-config
          configMap:
            name: qbittorrent-config
        - name: webui-credentials
          secret:
            secretName: qbittorrent-webui
